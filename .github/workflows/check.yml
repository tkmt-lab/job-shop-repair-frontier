name: check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all 153 schedules without a solver
        run: python -S -B verify_data.py
      - run: python -m pip install -r requirements.txt
      - name: Check repair, exhaustive tiny frontier, and failure handling
        run: python -B -m unittest discover -s tests -v
